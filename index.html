<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>কলা কৰ্মী - Art | Manuj Borah</title>
<style>
body{font-family:system-ui;background:#fef9e7;margin:0;padding:10px;text-align:center}
h1{color:#b94e00}
.card{background:white;padding:15px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);margin:15px auto;max-width:500px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery img{width:100%;border-radius:12px}
button{background:#c0392b;color:white;border:none;padding:10px 15px;border-radius:8px;margin:5px}
</style>
</head>
<body>
<h1>🎨 কলা কৰ্মী - Art</h1>
<p><b>Manuj Kumar Borah | Teok, Jorhat, Assam</b></p>
<div class="card">
<h2>🖼️ মোৰ ছবি</h2>
<div class="gallery">
<img src="painting1.jpg">
<img src="painting2.jpg">
</div>
<p>আপোনাৰ Painting বোৰ ইয়াত দেখা যাব</p>
</div>
<div class="card">
<h2>📸 Photo Filter</h2>
<input type="file" id="up" accept="image/*"><br><br>
<canvas id="c"></canvas><br>
<button onclick="f('grayscale(100%)')">Black White</button>
<button onclick="f('sepia(100%)')">Sepia</button>
<button onclick="f('none')">Original</button><br>
<button onclick="d()" style="background:green">⬇️ Download</button>
</div>
<script>
let I=new Image(),C=document.getElementById('c'),X=C.getContext('2d');
document.getElementById('up').addEventListener('change',e=>{
I.src=URL.createObjectURL(e.target.files[0]);
I.onload=()=>{C.width=I.width;C.height=I.height;X.drawImage(I,0,0);}
});
function f(a){X.filter=a;X.drawImage(I,0,0,C.width,C.height);}
function d(){let a=document.createElement('a');a.download='art.png';a.href=C.toDataURL();a.click();}
</script>
</body>
</html>
