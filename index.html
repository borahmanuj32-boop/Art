<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Final Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#fafafa;color:#222}
.header{background:#111;color:#fff;padding:20px;text-align:center}
.header h1{font-size:24px}
.header p{opacity:0.7;margin-top:5px}
.gallery{padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1000px;margin:20px auto}
.gallery img{width:100%;height:200px;object-fit:cover;border-radius:14px;cursor:pointer;transition:0.3s;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.gallery img:hover{transform:scale(1.03)}
.footer{text-align:center;padding:30px;opacity:0.5;font-size:14px}
/* Lightbox */
#lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:999}
#lightbox img{max-width:90%;max-height:85%;border-radius:10px}
</style>
</head>
<body>

<div class="header">
  <h1>📸 My Fixed Gallery</h1>
  <p>আপোনাৰ সকলো ফটো ইয়াত দেখা পাব</p>
</div>

<div class="gallery" id="gallery"></div>

<div class="footer">Made with ❤️ - Update ফটো Cloudinary ত</div>

<div id="lightbox" onclick="this.style.display='none'"><img id="lightImg"></div>

<script>
// ===== CONFIG - মাথোঁ এইখিনি Change কৰক =====
const CLOUD_NAME = "dlccsnkoo"; // আপোনাৰ Cloudinary Cloud Name
const FOLDER = "my-gallery"; // আপোনাৰ Folder ৰ নাম
const photos = [
  "photo1","photo2","photo3","photo4","photo5","photo6",
  "photo7","photo8","photo9","photo10"
];
// ==========================================

const galleryDiv = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightImg = document.getElementById("lightImg");

function load(){
  galleryDiv.innerHTML = "";
  photos.forEach(name => {
    const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/q_auto,f_auto,w_500/${FOLDER}/${name}`;
    const img = document.createElement("img");
    img.src = url;
    img.loading = "lazy";
    img.onerror = function(){ this.style.display="none" } // ফটো নাথাক
