<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENUS ART GALLERY TEOK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2}
header{background:#1e60ff;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;position:sticky;top:0;z-index:100}
.logo{font-weight:900;line-height:1}
.logo span{color:#ffeb3b;font-size:12px;display:block}
.header-right{display:flex;gap:8px;align-items:center}
.header-right input{padding:7px 10px;border-radius:20px;border:none;width:110px}
.btn{background:#fff;color:#1e60ff;padding:6px 14px;border-radius:20px;border:none;font-weight:700;cursor:pointer}
.btn-blue{background:#0d47ff;color:#fff}
#slider{width:100%;height:280px;background:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#slider img{width:100%;height:100%;object-fit:cover;display:none}
#slider img.active{display:block}
#slider.placeholder{color:#999}
.filters{display:flex;gap:10px;padding:12px;background:#fff;overflow:auto}
.filters button{padding:8px 16px;border-radius:20px;border:1px solid #ccc;background:#fff;cursor:pointer}
.filters button.active{background:#1e60ff;color:#fff}
#gallery{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:8px}
.admin-bar{display:none;background:#ff6161;color:#fff;padding:10px;text-align:center;gap:10px;justify-content:center}
.admin-bar.show{display:flex}
.admin-bar button{background:#fff;color:#ff6161;border:none;padding:8px 14px;border-radius:20px;font-weight:800;cursor:pointer}
#adminModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center}
#adminModal.show{display:flex}
.modal-box{background:#fff;padding:20px;border-radius:14px;width:90%;max-width:340px}
.modal-box input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
#logoutMainBtn{background:#ff6161!important;color:#fff!important;display:none}
#gear{position:fixed;right:18px;bottom:80px;background:#222;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;z-index:200}
.top-info{display:flex;justify-content:space-between;padding:12px 14px;background:#fff;font-weight:700}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center"><div style="font-size:28px;margin-right:10px">☰</div><div class="logo">VENUS ART<br><span>GALLERY TEOK</span></div></div>
<div class="header-right"><input id="searchInput" placeholder="Search" oninput="render()"><button class="btn btn-blue">Blog</button><button class="btn" id="loginBtn" onclick="openLogin()">লগইন</button><button id="logoutMainBtn" class="btn" onclick="logout()">Logout</button></div>
</header>
<div id="adminBar" class="admin-bar"><button onclick="addNewSlide()">+ Add Slide</button><button onclick="addNewArt()">+ Add Art</button></div>
<div id="slider"><div class="placeholder" id="slidePlaceholder">No Slides - Add from Admin</div></div>
<div class="filters"><button class="active" onclick="filterCat('All',this)">All</button><button onclick="filterCat('Traditional',this)">Traditional</button><button onclick="filterCat('Village',this)">Village</button><button onclick="filterCat('Modern',this)">Modern</button></div>
<div class="top-info"><span>Best Artworks</span><span id="itemCount">0 Items</span></div>
<div id="gallery"></div>
<div id="gear" onclick="openLogin()">⚙️</div>
<div id="adminModal"><div class="modal-box"><h3>Admin Login</h3><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn btn-blue" style="width:100%;margin-top:10px" onclick="doLogin()">Login</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeLogin()">Close</button><p style="font-size:12px;margin-top:8px">admin / admin123</p></div></div>
<script>
let products=JSON.parse(localStorage.getItem('products')||'[]');
let slides=JSON.parse(localStorage.getItem('slides')||'[]');
let currentFilter='All';let currentSlide=0;let isAdmin=localStorage.getItem('isAdmin')==='1';
function save(){localStorage.setItem('products',JSON.stringify(products));localStorage.setItem('slides',JSON.stringify(slides));}
function openLogin(){document.getElementById('adminModal').classList.add('show')}
function closeLogin(){document.getElementById('adminModal').classList.remove('show')}
function doLogin(){let u=document.getElementById('u').value.trim();let p=document.getElementById('p').value.trim();if(u==='admin'&&p==='admin123'){isAdmin=true;localStorage.setItem('isAdmin','1');closeLogin();updateUI();alert('Login Success!')}else alert('Wrong!')}
function logout(){isAdmin=false;localStorage.removeItem('isAdmin');updateUI();}
function updateUI(){document.getElementById('adminBar').classList.toggle('show',isAdmin);document.getElementById('logoutMainBtn').style.display=isAdmin?'block':'none';document.getElementById('loginBtn').style.display=isAdmin?'none':'block';}
function filterCat(c,btn){currentFilter=c;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function render(){let q=document.getElementById('searchInput').value.toLowerCase();let list=products.filter(p=>{let mCat=currentFilter==='All'||(p.cat||'Traditional')===currentFilter;let mSearch=p.name.toLowerCase().includes(q);return mCat&&mSearch;});document.getElementById('itemCount').textContent=list.length+' Items';let g=document.getElementById('gallery');g.innerHTML='';if(list.length===0){g.innerHTML='<div style="grid-column:1/3;text-align:center;color:#999;padding:30px">No Artworks - Add from Admin</div>';return}list.forEach((p)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${p.img}"><div class="card-body"><b>${p.name}</b><br>₹${p.price}<br>${isAdmin?`<button onclick="delArt(${products.indexOf(p)})" style="background:#ff6161;color:#fff;border:none;padding:4px 8px;border-radius:10px;margin-top:6px">Delete</button>`:''}</div>`;g.appendChild(d);});}
function renderSlides(){let s=document.getElementById('slider');let ph=document.getElementById('slidePlaceholder');s.querySelectorAll('img').forEach(el=>el.remove());if(slides.length===0){ph.style.display='block';return}ph.style.display='none';slides.forEach((src,idx)=>{let im=document.createElement('img');im.src=src;if(idx===currentSlide)im.classList.add('active');s.appendChild(im);});}
function nextSlide(){if(slides.length===0)return;currentSlide=(currentSlide+1)%slides.length;renderSlides();}
setInterval(nextSlide,3000);
function addNewSlide(){if(!isAdmin){alert('Please Login First');openLogin();return}let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let r=new FileReader();r.onload=ev=>{slides.unshift(ev.target.result);save();renderSlides();alert('Slide Done!');};r.readAsDataURL(e.target.files[0]);};inp.click();}
function addNewArt(){if(!isAdmin){alert('Please Login First');openLogin();return}let n=prompt('Art Name:');if(!n)return;let pr=prompt('Price:','2000');let cat=prompt('Category: Traditional/Village/Modern','Traditional')||'Traditional';let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let r=new FileReader();r.onload=ev=>{products.unshift({name:n,price:pr,cat:cat,img:ev.target.result});save();render();alert('Art Done!');};r.readAsDataURL(e.target.files[0]);};inp.click();}
function delArt(idx){if(confirm('Delete?')){products.splice(idx,1);save();render();}}
updateUI();render();renderSlides();
</script>
</body>
</html>
