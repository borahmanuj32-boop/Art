<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENUS ART GALLERY, TEOK</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,sans-serif}
body{background:#f1f3f6;padding-bottom:70px}
.top{background:#2874f0;color:#fff;padding:12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;cursor:pointer}
.search{flex:1;display:flex;background:#fff;border-radius:3px;overflow:hidden;position:relative}
.search input{flex:1;padding:10px;border:0;outline:none}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;color:#000;display:none;z-index:101;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.suggest div{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.icons{display:flex;gap:10px;font-size:12px;font-weight:500}
.icons span{cursor:pointer;background:rgba(0,0,0,.1);padding:5px 8px;border-radius:4px}
.cats{background:#fff;display:flex;gap:15px;padding:12px;overflow-x:auto}
.cats div{text-align:center;cursor:pointer;min-width:65px;font-size:12px;font-weight:500}
.cats img{width:60px;height:60px;border-radius:50%;display:block;margin:0 auto 5px;object-fit:cover}
.banner{margin:8px;background:#fff;border-radius:4px;overflow:hidden;height:150px}
.slides{display:flex;transition:0.5s;height:100%}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#fff;text-align:center}
.filterBar{background:#fff;padding:10px;display:flex;gap:8px;overflow-x:auto;margin:8px 8px 0;border-radius:4px}
.filterBar button,.filterBar select{border:1px solid #ccc;background:#fff;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
.card{background:#fff;padding:10px;border-radius:4px;position:relative}
.card img{width:100%;height:160px;object-fit:cover;border-radius:4px}
.heart{position:absolute;top:8px;right:8px;background:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#aaa;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;z-index:2}
.heart.active{color:red}
.price{font-weight:700}.mrp{color:gray;text-decoration:line-through;font-size:12px;margin-left:4px}.off{color:#388e3c;font-size:12px;font-weight:700;margin-left:4px}
.rating{background:#388e3c;color:#fff;font-size:11px;padding:2px 6px;border-radius:3px}
.buyRow{display:flex;gap:5px;margin-top:8px}.buyBtn{flex:1;padding:9px;font-size:12px;font-weight:700;border-radius:3px;border:0;cursor:pointer}
.addCart{background:#fff;border:1px solid #ccc}.buyNow{background:#fb641b;color:#fff}
.modalBg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;z-index:999;overflow-y:auto;padding:20px}
.modalBox{background:#fff;max-width:900px;margin:20px auto;border-radius:8px;overflow:hidden}
.formBox{background:#fff;padding:20px;border-radius:8px;max-width:400px;margin:30px auto}
.formBox input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:4px}
.formBox button{width:100%;padding:12px;background:#fb641b;color:#fff;border:0;border-radius:4px;font-weight:700;margin-top:10px;cursor:pointer}
.sidePanel{position:fixed;top:0;right:-100%;width:90%;max-width:380px;height:100%;background:#fff;z-index:1000;transition:0.3s;overflow-y:auto}
.sidePanel.open{right:0}.panelHead{background:#2874f0;color:#fff;padding:15px;display:flex;justify-content:space-between}
.bottomNav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -1px 4px rgba(0,0,0,.15);z-index:200}
.bottomNav div{text-align:center;font-size:11px;cursor:pointer;padding:5px}
</style>
</head>
<body>
<div class="top">
<div class="logo" onclick="location.reload()">VENUS<br><span style="font-size:11px;color:#ffe500">ART GALLERY TEOK</span></div>
<div class="search"><input id="searchInput" placeholder="Search paintings..." onkeyup="doSearch()"><button style="padding:0 12px;border:0;background:#fff">🔍</button><div class="suggest" id="suggest"></div></div>
<div class="icons"><span onclick="openPanel('cartPanel')">🛒<span id="cCount">0</span></span><span onclick="openPanel('wishlistPanel')">♡<span id="wCount">0</span></span></div>
</div>
<div class="cats" id="cats"></div>
<div class="banner" onclick="nextSlide()"><div class="slides" id="slides"><div class="slide" style="background:linear-gradient(90deg,#ff9f00,#fb641b)">🔥 50% OFF - VENUS FESTIVAL</div><div class="slide" style="background:linear-gradient(90deg,#2874f0,#1a237e)">🎨 Radha Krishna Collection</div><div class="slide" style="background:linear-gradient(90deg,#388e3c,#1b5e20)">🚚 Free Delivery in Teok</div></div></div>
<div class="filterBar"><select onchange="sortBy(this.value)"><option value="">Sort</option><option value="low">Low to High</option><option value="high">High to Low</option></select><button onclick="filterRating()">4★ & above</button><button onclick="filterCat('all')">Clear All</button><span id="resultCount" style="margin-left:auto;font-size:12px;color:gray"></span></div>
<div class="grid" id="grid"></div>
<div class="modalBg" id="productModal" onclick="if(event.target==this)this.style.display='none'"><div class="modalBox" id="pBox"></div></div>
<div class="sidePanel" id="cartPanel"><div class="panelHead"><span>My Cart (<span id="cCount2">0</span>)</span><span onclick="closePanel('cartPanel')">✕</span></div><div id="cartItems" style="padding:10px"></div><div style="padding:12px;border-top:2px solid #eee"><p id="priceDetail" style="font-size:13px;line-height:22px"></p><button class="buyBtn buyNow" style="margin-top:10px;padding:12px" onclick="checkout()">Place Order - WhatsApp</button></div></div>
<div class="sidePanel" id="wishlistPanel"><div class="panelHead"><span>Wishlist</span><span onclick="closePanel('wishlistPanel')">✕</span></div><div id="wishItems" style="padding:10px"></div></div>
<div class="sidePanel" id="ordersPanel"><div class="panelHead"><span>My Orders</span><span onclick="closePanel('ordersPanel')">✕</span></div><div id="orderList" style="padding:10px"></div></div>
<div class="modalBg" id="loginModal" onclick="if(event.target==this)closeLogin()"><div class="formBox"><h3>Login / Address</h3><p style="font-size:12px;color:gray;margin:10px 0">Order কৰিবলৈ নাম ঠিকনা লাগিব</p><input id="lName" placeholder="Full Name *"><input id="lPhone" placeholder="Mobile Number *"><input id="lAddress" placeholder="Full Address"><input id="lPin" placeholder="PIN 785112"><button onclick="doLogin()" style="background:#2874f0">Save & Continue</button><button onclick="closeLogin()" style="background:#eee;color:#000">Close</button></div></div>
<div class="modalBg" id="adminModal" onclick="if(event.target==this)closeAdmin()"><div class="formBox"><h3>🔒 ADMIN</h3><p style="font-size:11px;color:gray">Password: venus123</p><input type="password" id="adminPass" placeholder="Password"><button onclick="unlockAdmin()" id="unlockBtn" style="background:#2874f0">Unlock</button><div id="adminUp" style="display:none"><hr style="margin:12px 0"><input id="aName" placeholder="Painting Name"><input id="aPrice" type="number" placeholder="Price"><input id="aMrp" type="number" placeholder="MRP"><input id="aCat" placeholder="Category"><input type="file" id="aFile" accept="image/*"><img id="aPrev" style="width:100%;height:150px;object-fit:cover;display:none;margin-top:8px"><button onclick="addProduct()" style="background:#388e3c">Upload & Save</button></div><button onclick="closeAdmin()" style="background:#eee;color:#000">Close</button></div></div>
<div class="bottomNav"><div onclick="location.reload()" style="color:#2874f0">🏠<br>Home</div><div onclick="openPanel('wishlistPanel')">♡<br>Wishlist</div><div onclick="openPanel('cartPanel')">🛒<br>Cart</div><div onclick="openPanel('ordersPanel')">📦<br>Orders</div><div onclick="openLogin()">👤<br><span id="uName">Login</span></div><div onclick="openAdmin()" style="background:#ffe500;border-radius:8px">🔒<br>Admin</div></div>
<script>
const defaultProducts=[
{id:1,name:"Radha Krishna Divine Art",cat:"radha",price:1499,mrp:2999,off:50,rating:4.5,reviews:1234,img:"https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=400",desc:"Handmade canvas"},
{id:2,name:"Abstract Color Splash",cat:"abstract",price:1999,mrp:3999,off:50,rating:4.3,reviews:892,img:"https://images.unsplash.com/photo-1541963463532-d68292c34b19?w=400",desc:"Modern art"},
{id:3,name:"Assam Village Scenery",cat:"village",price:1299,mrp:2599,off:50,rating:4.6,reviews:2100,img:"https://images.unsplash.com/photo-1500462918059-b1a0cb512f1d?w=400",desc:"Village beauty"},
{id:4,name:"Modern Line Portrait",cat:"modern",price:2499,mrp:4999,off:50,rating:4.4,reviews:543,img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400",desc:"Minimalist"},
{id:5,name:"Lady Portrait Classic",cat:"portrait",price:2750,mrp:4500,off:38,rating:4.7,reviews:3210,img:"https://images.unsplash.com/photo-1579783901586-d88db74b4fe4?w=400",desc:"Classic"},
{id:6,name:"Golden Abstract Art",cat:"abstract",price:3200,mrp:6000,off:46,rating:4.8,reviews:4123,img:"https://images.unsplash.com/photo-1549490349-8643362247b5?w=400",desc:"Luxury"}
];
let savedArts=JSON.parse(localStorage.getItem('venusArts')||'[]');
let products=[...savedArts,...defaultProducts];
let cart=JSON.parse(localStorage.getItem('venusCart')||'[]');
let wishlist=JSON.parse(localStorage.getItem('venusWish')||'[]');
let currentList=[...products];let slideIndex=0;
function initCats(){let cats=['all','radha','abstract','village','modern','portrait'];let h='';cats.forEach(c=>{h+=`<div onclick="filterCat('${c}')"><img src="https://picsum.photos/80/80?random=${c.length*5}"><div>${c.toUpperCase()}</div></div>`;});document.getElementById('cats').innerHTML=h;}
function render(list){let g=document.getElementById('grid');g.innerHTML='';currentList=list;document.getElementById('resultCount').innerText=list.length+' items';list.forEach(p=>{let isWish=wishlist.includes(p.id);g.innerHTML+=`<div class="card"><div class="heart ${isWish?'active':''}" onclick="toggleWish(${p.id})">${isWish?'♥':'♡'}</div><div onclick="openProduct(${p.id})"><img src="${p.img}"><p style="font-size:13px;margin-top:5px;height:32px;overflow:hidden">${p.name}</p><p><span class="rating">${p.rating} ★</span> <span style="font-size:11px;color:gray">(${p.reviews})</span></p><p><span class="price">₹${p.price}</span><span class="mrp">₹${p.mrp}</span><span class="off">${p.off}%</span></p></div><div class="buyRow"><button class="buyBtn addCart" onclick="addToCart(${p.id})">Add</button><button class="buyBtn buyNow" onclick="buyNow(${p.id})">Buy</button></div></div>`;});updateCounts();}
function doSearch(){let q=document.getElementById('searchInput').value.toLowerCase();if(!q){document.getElementById('suggest').style.display='none';render(products);return}let f=products.filter(p=>p.name.toLowerCase().includes(q)||p.cat.includes(q));let sug=document.getElementById('suggest');sug.innerHTML='';sug.style.display='block';f.slice(0,5).forEach(p=>{sug.innerHTML+=`<div onclick="openProduct(${p.id});document.getElementById('suggest').style.display='none'">${p.name}</div>`;});render(f);}
function filterCat(c){document.getElementById('suggest').style.display='none';if(c=='all')render(products);else render(products.filter(p=>p.cat==c));}
function filterRating(){render(products.filter(p=>p.rating>=4))}
function sortBy(v){let l=[...currentList];if(v=='low')l.sort((a,b)=>a.price-b.price);if(v=='high')l.sort((a,b)=>b.price-a.price);render(l);}
function openProduct(id){let p=products.find(x=>x.id==id);document.getElementById('productModal').style.display='block';document.getElementById('pBox').innerHTML=`<div style="padding:15px"><img src="${p.img}" style="width:100%;height:300px;object-fit:cover;border-radius:8px"><h2 style="margin:10px 0">${p.name}</h2><p><span class="rating">${p.rating} ★</span> ${p.reviews} Ratings</p><p style="margin:10px 0"><span style="font-size:22px;font-weight:700">₹${p.price}</span><span class="mrp">₹${p.mrp}</span><span class="off">${p.off}% off</span></p><p style="color:#388e3c">✓ Free Delivery</p><div style="display:flex;gap:6px;margin:12px 0"><input id="pinCheck" placeholder="PIN 785112" style="flex:1;padding:8px;border:1px solid #2874f0;border-radius:4px"><button onclick="checkPin()" style="background:#2874f0;color:#fff;border:0;padding:8px 12px;border-radius:4px">Check</button></div><p id="pinRes"></p><p style="margin-top:10px"><b>Seller:</b> VENUS ART GALLERY TEOK</p><div style="display:flex;gap:8px;margin-top:15px"><button class="buyBtn addCart" style="padding:14px" onclick="addToCart(${p.id})">🛒 ADD TO CART</button><button class="buyBtn buyNow" style="padding:14px" onclick="buyNow(${p.id})">⚡ BUY NOW</button></div><p style="text-align:center;margin-top:15px;cursor:pointer;color:gray" onclick="document.getElementById('productModal').style.display='none'">✕ Close</p></div>`;}
function checkPin(){let pin=document.getElementById('pinCheck').value;let res=document.getElementById('pinRes');if(pin.startsWith('785'))res.innerHTML='<span style="color:green">✓ Delivery by Tomorrow, Free</span>';else if(pin.length==6)res.innerHTML='<span style="color:orange">Delivery in 3-4 days</span>';else res.innerHTML='<span style="color:red">Enter valid PIN</span>';}
function addToCart(id){if(!cart.includes(id)){cart.push(id);localStorage.setItem('venusCart',JSON.stringify(cart))}renderCart();updateCounts();openPanel('cartPanel');}
function buyNow(id){addToCart(id);setTimeout(()=>{checkout(id)},200)}
function toggleWish(id){if(wishlist.includes(id))wishlist=wishlist.filter(x=>x!=id);else wishlist.push(id);localStorage.setItem('venusWish',JSON.stringify(wishlist));render(currentList);renderWish();}
function renderCart(){let cDiv=document.getElementById('cartItems');cDiv.innerHTML='';let total=0,mrpTotal=0;if(cart.length==0){cDiv.innerHTML='<p style="text-align:center;color:gray;padding:20px">Cart empty</p>';}cart.forEach(id=>{let p=products.find(x=>x.id==id);if(!p)return;total+=p.price;mrpTotal+=p.mrp;cDiv.innerHTML+=`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee"><img src="${p.img}" style="width:70px;height:70px;object-fit:cover"><div style="flex:1"><p style="font-size:13px">${p.name}</p><p><span class="price">₹${p.price}</span></p><p style="color:red;font-size:12px;cursor:pointer" onclick="removeCart(${id})">Remove</p></div></div>`;});document.getElementById('priceDetail').innerHTML=`Price: ₹${mrpTotal}<br>Discount: -₹${mrpTotal-total}<br><b>Total: ₹${total}</b>`;document.getElementById('cCount2').innerText=cart.length;}
function removeCart(id){cart=cart.filter(x=>x!=id);localStorage.setItem('venusCart',JSON.stringify(cart));renderCart();updateCounts();}
function renderWish(){let w=document.getElementById('wishItems');w.innerHTML='';if(wishlist.length==0)w.innerHTML='<p style="text-align:center;color:gray;padding:20px">No wishlist</p>';wishlist.forEach(id=>{let p=products.find(x=>x.id==id);if(!p)return;w.innerHTML+=`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee"><img src="${p.img}" style="width:60px;height:60px"><div style="flex:1"><p style="font-size:13px">${p.name}</p><p>₹${p.price}</p></div><button onclick="addToCart(${id})" style="background:#fb641b;color:#fff;border:0;padding:6px 10px;border-radius:3px">Add</button></div>`;});}
function updateCounts(){document.getElementById('cCount').innerText=cart.length;document.getElementById('wCount').innerText=wishlist.length;}
function checkout(singleId){let user=localStorage.getItem('v_user');if(!user){alert('Please Login first');openLogin();return;}let phone=localStorage.getItem('v_phone');let addr=localStorage.getItem('v_addr');let items=singleId?[products.find(x=>x.id==singleId)]:cart.map(id=>products.find(x=>x.id==id));let total=items.reduce((s,p)=>s+(p?p.price:0),0);let msg=`*NEW ORDER - VENUS TEOK*%0AName: ${user}%0APhone: ${phone}%0AAddress: ${addr}%0AItems: ${items.map(p=>p?p.name:'').join(', ')}%0ATotal: ₹${total}`;let orders=JSON.parse(localStorage.getItem('venusOrders')||'[]');orders.push({date:new Date().toLocaleString(),items,total,user});localStorage.setItem('venusOrders',JSON.stringify(orders));window.open('https://wa.me/919101573700?text='+msg,'_blank');}
function openPanel(id){document.getElementById(id).classList.add('open');if(id=='cartPanel')renderCart();if(id=='wishlistPanel')renderWish();if(id=='ordersPanel')renderOrders();}
function closePanel(id){document.getElementById(id).classList.remove('open');}
function renderOrders(){let div=document.getElementById('orderList');let orders=JSON.parse(localStorage.getItem('venusOrders')||'[]');div.innerHTML=orders.length?'':'<p style="text-align:center;color:gray;padding:20px">No orders</p>';orders.slice().reverse().forEach(o=>{div.innerHTML+=`<div style="border:1px solid #ddd;padding:10px;margin-bottom:8px;border-radius:6px"><p style="font-size:12px;color:gray">${o.date}</p><p style="font-weight:700">₹${o.total} - ${o.items.length} items</p><p style="font-size:12px">${o.items.map(i=>i?i.name:'').join(', ')}</p></div>`;});}
function openLogin(){document.getElementById('loginModal').style.display='block';}
function closeLogin(){document.getElementById('loginModal').style.display='none';}
function doLogin(){let n=document.getElementById('lName').value.trim();let ph=document.getElementById('lPhone').value.trim();if(!n||!ph){alert('Name & Phone required');return;}localStorage.setItem('v_user',n);localStorage.setItem('v_phone',ph);localStorage.setItem('v_addr',document.getElementById('lAddress').value+' PIN:'+document.getElementById('lPin').value);document.getElementById('uName').innerText=n;closeLogin();alert('Login Success! '+n);}
function openAdmin(){document.getElementById('adminModal').style.display='block';}
function closeAdmin(){document.getElementById('adminModal').style.display='none';}
function unlockAdmin(){if(document.getElementById('adminPass').value=='venus123'){document.getElementById('adminUp').style.display='block';document.getElementById('unlockBtn').style.display='none';}else alert('Wrong password');}
let selectedImageData='';document.getElementById('aFile').addEventListener('change',function(e){let r=new FileReader();r.onload=function(ev){selectedImageData=ev.target.result;let img=document.getElementById('aPrev');img.src=selectedImageData;img.style.display='block';};r.readAsDataURL(e.target.files[0]);});
function addProduct(){let name=document.getElementById('aName').value||'My Art';let price=parseInt(document.getElementById('aPrice').value)||1499;let mrp=parseInt(document.getElementById('aMrp').value)||2999;let cat=document.getElementById('aCat').value||'modern';if(!selectedImageData){alert('Select photo');return;}let newP={id:Date.now(),name,cat,price,mrp,off:Math.round((1-price/mrp)*100),rating:4.8,reviews:5,img:selectedImageData,desc:'New'};let saved=JSON.parse(localStorage.getItem('venusArts')||'[]');saved.push(newP);localStorage.setItem('venusArts',JSON.stringify(saved));products=[...saved,...defaultProducts];render(products);alert('Uploaded LIVE!');closeAdmin();}
function nextSlide(){slideIndex=(slideIndex+1)%3;document.getElementById('slides').style.transform=`translateX(-${slideIndex*100}%)`;}
setInterval(nextSlide,3000);
initCats();render(products);renderCart();
let u=localStorage.getItem('v_user');if(u)document.getElementById('uName').innerText=u;
</script>
</body>
</html>
