<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENUS ART GALLERY - Admin Upload</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Roboto;background:#f1f3f6}
.top{background:#2874f0;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:99}
.logo{font-weight:bold}.logo span{color:#ffe500}
.btn{background:#fff;color:#2874f0;padding:6px 10px;border-radius:2px;border:0;font-weight:bold;font-size:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;padding:10px}
.card{background:#fff;padding:10px;border-radius:3px;position:relative}
.card img{width:100%;height:170px;object-fit:cover}
.buy{display:block;text-align:center;margin-top:6px;background:#fb641b;color:#fff;padding:8px;text-decoration:none;border-radius:2px;font-weight:bold;font-size:13px}
#adminBox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200}
.form{background:#fff;padding:20px;border-radius:8px;width:92%;max-width:380px}
.form input{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:3px}
.form button{width:100%;padding:11px;background:#2874f0;color:#fff;border:0;font-weight:bold;margin-top:8px;cursor:pointer}
</style></head><body>

<div class="top">
<div class="logo">VENUS <span>Gallery</span></div>
<div>
<button class="btn" onclick="openAdmin()">🔒 Admin Upload</button>
<button class="btn" id="uName">Login</button>
</div>
</div>

<div style="background:#fff;padding:10px;margin:8px;text-align:center">
<h3>VENUS ART GALLERY, TEOK</h3><p style="font-size:12px;color:gray">তুমি Upload কৰা ফটো ইয়াত দেখা যাব</p>
</div>

<div class="grid" id="grid"></div>

<!-- SECRET ADMIN PANEL -->
<div id="adminBox">
<div class="form">
<h3>🔐 Admin Only - Photo Upload</h3>
<p style="font-size:12px;color:gray;margin-bottom:10px">Password: venus123 (কেৱল তুমি জানা)</p>
<input type="password" id="adminPass" placeholder="Admin Password">
<div id="uploadArea" style="display:none">
<hr style="margin:10px 0">
<input id="pName" placeholder="Painting Name - Eg: Radha Krishna">
<input id="pPrice" placeholder="Price - Eg: 1499" type="number">
<input type="file" id="pFile" accept="image/*" style="padding:5px">
<img id="preview" style="width:100%;height:150px;object-fit:cover;display:none;margin-top:8px;border:1px solid #ddd">
<button onclick="uploadPhoto()" style="background:#388e3c">Upload & Save</button>
<button onclick="clearAll()" style="background:#000">Delete All My Uploads</button>
</div>
<button onclick="checkPass()">Unlock</button>
<p style="text-align:center;font-size:12px;color:gray;margin-top:8px" onclick="closeAdmin()">Close</p>
</div>
</div>

<script>
function openAdmin(){document.getElementById('adminBox').style.display='flex'}
function closeAdmin(){document.getElementById('adminBox').style.display='none'}
function checkPass(){
if(document.getElementById('adminPass').value=='venus123'){
document.getElementById('uploadArea').style.display='block';
alert('Admin Unlock! এতিয়া ফটো Upload কৰিব পাৰা');
}else alert('Wrong Password! কেৱল মালিকেহে পাৰিব');
}
document.getElementById('pFile').addEventListener('change',function(e){
let r=new FileReader(); r.onload=function(ev){document.getElementById('preview').src=ev.target.result; document.getElementById('preview').style.display='block'; document.getElementById('preview').dataset.url=ev.target.result;}; r.readAsDataURL(e.target.files[0]);
});
function uploadPhoto(){
let name=document.getElementById('pName').value||'My Art';
let price=document.getElementById('pPrice').value||'1499';
let img=document.getElementById('preview').dataset.url;
if(!img){alert('ফটো Select কৰা');return}
let data=JSON.parse(localStorage.getItem('venusArts')||'[]');
data.push({name,price,img}); localStorage.setItem('venusArts',JSON.stringify(data));
render(); alert('Uploaded! Website ত আহি গল'); closeAdmin();
}
function render(){
let grid=document.getElementById('grid'); grid.innerHTML='';
let defaults=[
{name:"Radha Krishna",price:1499,img:"https://picsum.photos/400/400?random=31"},
{name:"Abstract Art",price:1999,img:"https://picsum.photos/400/400?random=32"},
];
let myArts=JSON.parse(localStorage.getItem('venusArts')||'[]');
let all=[...myArts.reverse(),...defaults];
all.forEach((p,i)=>{
let wa=`https://wa.me/919101573700?text=`+encodeURIComponent(`Hi Venus, I want ${p.name} Rs${p.price}`);
grid.innerHTML+=`<div class="card"><img src="${p.img}"><p style="font-size:13px;margin-top:5px">${p.name} ${i<myArts.length?'<span style="background:green;color:#fff;font-size:9px;padding:2px 4px;border-radius:3px">NEW</span>':''}</p><p style="font-weight:bold">₹${p.price}</p><a class="buy" href="${wa}">Buy Now</a></div>`;
});
}
function clearAll(){if(confirm('সকলো Upload Delete কৰিম নে?')){localStorage.removeItem('venusArts'); render();}}
render();
</script>
</body></html>
