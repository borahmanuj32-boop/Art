<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENUS ART GALLERY TEOK - Manuj Borah</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#fdf6e3;margin:0}
.hero{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;padding:30px 15px;text-align:center}
.hero h1{margin:0;font-size:32px;letter-spacing:1px}
.nav{display:flex;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.nav button{border:none;padding:10px 16px;border-radius:20px;font-weight:bold;background:#eee}
.nav button.active{background:#6a11cb;color:#fff}
.card{background:#fff;margin:12px auto;max-width:900px;padding:15px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
input{width:95%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}
.btn-up{background:#c0392b;color:#fff;width:96%;padding:14px;font-size:17px;border-radius:12px;border:none;font-weight:bold}
.show-gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.show-gallery{grid-template-columns:1fr 1fr 1fr}}
.show-item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.12);position:relative}
.show-item img{width:100%;height:220px;object-fit:cover}
.show-body{padding:10px}
.price-tag{background:#0a8a00;color:#fff;padding:4px 10px;border-radius:20px;font-weight:800;font-size:14px;position:absolute;top:8px;left:8px}
.buy-btn{background:#25D366;color:#fff;width:100%;padding:11px;border:none;border-radius:10px;font-weight:bold;margin-top:6px}
</style>
</head>
